name: Package and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop .#electron --command pnpm install --frozen-lockfile

      - name: Build and package
        run: nix develop .#electron --command pnpm pack

      - name: Create release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu

          TAG="$(node -p "require('./package.json').version")"
          PACKAGE="nonanium-ui.tgz"

          test -f "$PACKAGE"

          sha256sum "$PACKAGE" > SHA256SUMS
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "$PACKAGE" SHA256SUMS \
            --verify-tag --title "$TAG" --notes "Source commit: $SHA. Artifact digest: SHA256SUMS."
